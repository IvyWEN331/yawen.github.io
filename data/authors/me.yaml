  I am a Postdoctoral Research Associate at the University of Cambridge, working at the intersection of architecture, digital twins, reality capture, knowledge systems, and artificial intelligence for the built environment. My research focuses on how geometric, semantic, and operational information can be integrated into shared digital representations that support building design, operation, safety, and robotic collaboration.

