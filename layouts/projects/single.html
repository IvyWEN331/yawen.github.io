{{ define "main" }}
<div class="project-page">
  <div class="project-page-inner">

    <a class="project-back-link" href="{{ "/projects/" | relLangURL }}">← Projects</a>

    <header class="project-header">
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}
        <div class="project-summary">{{ . | markdownify }}</div>
      {{ end }}
    </header>

    {{ $detail := .Resources.GetMatch "project-detail*" }}
    {{ if not $detail }}
      {{ $detail = .Resources.GetMatch "featured*" }}
    {{ end }}

    {{ with $detail }}
      <figure class="project-featured">
        <img
          src="{{ .RelPermalink }}"
          width="{{ .Width }}"
          height="{{ .Height }}"
          alt="{{ $.Title }}"
          decoding="async"
        >
      </figure>
    {{ end }}

    <article class="project-content prose prose-slate dark:prose-invert max-w-none" data-pagefind-body>
      {{ .Content }}
    </article>

  </div>
</div>
{{ end }}
